<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Link na Bio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0}</style>
</head>
<body>
<!--
  =====================================================================
  PÁGINA "LINK NA BIO" — com quiz de estilo e joguinhos que dão cupom

  COMO USAR
  1) Arquivo sozinho: suba este index.html na hospedagem e pronto.
  2) WordPress/Elementor: copie TUDO de <div id="lb"> até o </div> final
     (marcado com "FIM DO BLOCO") e cole num widget "HTML" do Elementor
     ou num bloco "HTML personalizado". Use um modelo de página sem
     cabeçalho/rodapé (Elementor Canvas) para ocupar a tela inteira.

  COMO EDITAR
  Tudo o que muda de uma loja para outra está no objeto CONFIG, lá no
  <script> no final: nome, logo, WhatsApp, links, cores, cupom, quiz.
  =====================================================================
-->
<div id="lb">
<style>
#lb{--p:#ff4f8b;--s:#ffb547;--a:#4cc9b0;--bg1:#fff6ee;--bg2:#ffe9f1;--tx:#4a3540;--mut:#8a7480;--card:rgba(255,255,255,.86);
  position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;box-sizing:border-box;
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--tx);
  background:linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 100%);line-height:1.35}
#lb *,#lb *::before,#lb *::after{box-sizing:border-box}
#lb [hidden]{display:none!important}
#lb button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
#lb a{-webkit-tap-highlight-color:transparent}
#lb button:focus-visible,#lb a:focus-visible{outline:3px solid var(--p);outline-offset:3px}
#lb h1,#lb h2,#lb h3,#lb p{margin:0}

/* fundo animado */
#lb .lb-shapes{position:absolute;inset:0;pointer-events:none;z-index:0}
#lb .lb-shapes span{position:absolute;display:block;opacity:.55;animation:lbFloat 10s ease-in-out infinite}
#lb .lb-shapes .c{border-radius:50%}
#lb .lb-shapes .q{border-radius:6px;transform:rotate(45deg)}
@keyframes lbFloat{0%,100%{translate:0 0}50%{translate:0 -18px}}
@keyframes lbSpin{to{transform:rotate(360deg)}}
@keyframes lbPulse{0%,100%{box-shadow:0 0 0 2px var(--p),0 8px 22px -10px var(--p)}50%{box-shadow:0 0 0 2px var(--p),0 0 0 7px color-mix(in srgb,var(--p) 18%,transparent)}}
@keyframes lbIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes lbPop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}

#lb .lb-wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:28px 16px 28px}
#lb [data-view]{animation:lbIn .35s ease both}

/* topo */
#lb .lb-logo{position:relative;width:156px;height:156px;margin:0 auto}
#lb .lb-logo::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(var(--p),var(--s),var(--a),#7aa7ff,var(--p));animation:lbSpin 7s linear infinite}
#lb .lb-logo-in{position:absolute;inset:6px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden}
#lb .lb-logo-in img{width:100%;height:100%;object-fit:cover}
#lb .lb-logo-in b{font-size:38px;font-weight:900;letter-spacing:-1px;
  background:linear-gradient(135deg,var(--p),var(--s));-webkit-background-clip:text;background-clip:text;color:transparent}
#lb .lb-name{margin-top:14px;text-align:center;font-size:24px;font-weight:900;letter-spacing:-.3px}
#lb .lb-slogan{text-align:center;font-weight:800;color:var(--mut);margin:4px 0 22px}
#lb .lb-slogan i{font-style:normal;color:var(--p);margin:0 5px}

/* botões de link */
#lb .lb-links{display:grid;gap:13px}
#lb .lb-link{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:11px 14px;border-radius:18px;
  background:var(--card);text-decoration:none;color:var(--tx);
  box-shadow:0 8px 20px -12px rgba(74,53,64,.45),inset 0 0 0 1px rgba(255,255,255,.9);
  transition:transform .15s ease,box-shadow .15s ease}
@media (hover:hover){#lb .lb-link:hover{transform:translateY(-2px);box-shadow:0 12px 24px -12px rgba(74,53,64,.5),inset 0 0 0 1px #fff}}
#lb .lb-link:active{transform:scale(.98)}
#lb .lb-link.hl{animation:lbPulse 2.4s ease-in-out infinite}
#lb .lb-ico{flex:0 0 44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:21px;
  background:color-mix(in srgb,var(--s) 18%,#fff)}
#lb .lb-ico svg{width:24px;height:24px;display:block}
#lb .lb-txt{flex:1;min-width:0;text-align:center}
#lb .lb-txt strong{display:block;font-size:16px;font-weight:800}
#lb .lb-txt small{display:block;font-size:13px;color:var(--mut);margin-top:2px}
#lb .lb-arrow{flex:0 0 auto;font-size:24px;color:var(--mut);line-height:1}
#lb .lb-badge{position:absolute;top:-10px;right:14px;background:var(--p);color:#fff;font-size:11px;font-weight:900;padding:3px 10px;border-radius:99px;box-shadow:0 4px 10px -4px var(--p)}

#lb .lb-quizcta{text-align:center;margin:26px 0 12px}
#lb .lb-quizcta h2{font-size:19px;font-weight:900;color:var(--p)}
#lb .lb-quizcta p{font-size:13px;color:var(--mut);margin-top:4px}
#lb .lb-foot{text-align:center;font-size:12px;color:var(--mut);margin-top:28px}

/* cabeçalho das telas internas */
#lb .lb-top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
#lb .lb-back{font-weight:800;color:var(--mut);padding:8px 12px 8px 4px;border-radius:12px}
#lb .lb-top h2{flex:1;font-size:18px;font-weight:900;text-align:center;margin-right:52px}
#lb .lb-pill{background:var(--p);color:#fff;font-weight:900;font-size:13px;padding:5px 12px;border-radius:99px;white-space:nowrap}
#lb .lb-sub{text-align:center;color:var(--mut);font-size:14px;margin:-6px 0 16px}

/* quiz */
#lb .lb-dots{display:flex;justify-content:center;gap:6px;margin-bottom:18px}
#lb .lb-dots span{width:28px;height:6px;border-radius:9px;background:rgba(74,53,64,.12)}
#lb .lb-dots span.on{background:var(--p)}
#lb .lb-q{font-size:21px;font-weight:900;text-align:center;margin-bottom:16px}
#lb .lb-opts{display:grid;gap:10px}
#lb .lb-opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:16px;background:var(--card);
  font-weight:800;text-align:left;box-shadow:0 6px 16px -12px rgba(74,53,64,.5),inset 0 0 0 1px #fff;transition:transform .12s}
#lb .lb-opt:active{transform:scale(.98)}
#lb .lb-opt span{font-size:24px}
#lb .lb-result{text-align:center;background:var(--card);border-radius:24px;padding:28px 20px;box-shadow:0 12px 30px -18px rgba(74,53,64,.6)}
#lb .lb-result .e{font-size:58px;animation:lbPop .5s ease both}
#lb .lb-result small{display:block;color:var(--mut);font-weight:800;margin-top:8px;text-transform:uppercase;font-size:12px;letter-spacing:.06em}
#lb .lb-result h3{font-size:25px;font-weight:900;color:var(--p);margin:4px 0 10px}
#lb .lb-result p{color:var(--tx)}
#lb .lb-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:16px;
  background:var(--p);color:#fff!important;font-weight:900;font-size:16px;text-decoration:none;margin-top:18px;box-shadow:0 10px 22px -12px var(--p)}
#lb .lb-btn.wa{background:#25d366;box-shadow:0 10px 22px -12px #25d366}
#lb .lb-btn.ghost{background:transparent;color:var(--mut)!important;box-shadow:none;margin-top:6px;font-weight:800}

/* sala de jogos */
#lb .lb-games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#lb .lb-game{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 12px 14px;border-radius:20px;background:var(--card);
  box-shadow:0 8px 20px -14px rgba(74,53,64,.55),inset 0 0 0 1px #fff;transition:transform .15s}
#lb .lb-game:active{transform:scale(.97)}
#lb .lb-game .e{font-size:38px}
#lb .lb-game strong{font-size:15px;font-weight:900}
#lb .lb-game small{font-size:12px;color:var(--mut)}
#lb .lb-bar{width:100%;height:7px;border-radius:9px;background:rgba(74,53,64,.1);overflow:hidden;margin-top:4px}
#lb .lb-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--s),var(--p));border-radius:9px}
#lb .lb-game.done{box-shadow:0 0 0 2px var(--a),0 8px 20px -14px rgba(74,53,64,.55)}

/* área do jogo */
#lb .lb-status{text-align:center;font-weight:800;color:var(--mut);min-height:22px;margin-bottom:12px}
#lb .lb-stage{position:relative;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center}
#lb .lb-ov{position:absolute;inset:-6px;z-index:5;display:grid;place-items:center;border-radius:22px;
  background:color-mix(in srgb,var(--bg1) 82%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:lbIn .25s ease both}
#lb .lb-ov>div{text-align:center;padding:24px;max-width:300px}
#lb .lb-ov .e{font-size:52px;animation:lbPop .45s ease both}
#lb .lb-ov h3{font-size:22px;font-weight:900;margin:6px 0}
#lb .lb-ov p{color:var(--mut)}

/* memória */
#lb .lb-mem{display:grid;gap:9px;width:100%;max-width:340px}
#lb .lb-card{aspect-ratio:1;border-radius:14px;font-size:30px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--p),var(--s));color:#fff;font-weight:900;box-shadow:0 6px 14px -10px rgba(74,53,64,.6)}
#lb .lb-card .b{display:none}
#lb .lb-card.open{background:#fff;animation:lbPop .3s ease both}
#lb .lb-card.open .f{display:none}
#lb .lb-card.open .b{display:block}
#lb .lb-card.ok{background:color-mix(in srgb,var(--a) 25%,#fff);box-shadow:inset 0 0 0 2px var(--a)}

/* pop it */
#lb .lb-pop{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:320px;padding:16px;border-radius:26px;
  background:color-mix(in srgb,var(--s) 22%,#fff);box-shadow:inset 0 0 0 2px #fff}
#lb .lb-bub{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 18%,color-mix(in srgb,var(--p) 22%,#fff) 60%);
  box-shadow:inset 0 -4px 6px rgba(74,53,64,.12);transition:transform .12s,background .12s}
#lb .lb-bub.on{background:radial-gradient(circle at 35% 30%,#fff 0 14%,var(--p) 55%);transform:scale(1.08);box-shadow:0 0 0 4px color-mix(in srgb,var(--p) 30%,transparent),0 0 18px var(--p)}
#lb .lb-bub.pop{transform:scale(.78);background:radial-gradient(circle,color-mix(in srgb,var(--a) 50%,#fff),#fff)}

/* sequência */
#lb .lb-simon{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:300px}
#lb .lb-pad{aspect-ratio:1;border-radius:26px;opacity:.42;transition:opacity .1s,transform .1s,box-shadow .1s;font-size:34px}
#lb .lb-pad.on{opacity:1;transform:scale(1.05);box-shadow:0 0 26px currentColor}

/* cobrinha */
#lb .lb-cv{display:block;border-radius:18px;background:#fff;box-shadow:0 10px 26px -16px rgba(74,53,64,.7);touch-action:none}
#lb .lb-pad4{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,50px);gap:8px;margin-top:14px}
#lb .lb-pad4 button{border-radius:14px;background:var(--card);font-size:20px;font-weight:900;box-shadow:0 6px 14px -10px rgba(74,53,64,.6),inset 0 0 0 1px #fff}
#lb .lb-pad4 button:active{background:color-mix(in srgb,var(--p) 25%,#fff)}

/* cupom */
#lb .lb-modal{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:16px;background:rgba(40,25,35,.45);animation:lbIn .25s ease both}
#lb .lb-box{position:relative;width:100%;max-width:360px;background:#fff;border-radius:26px;padding:28px 22px 20px;text-align:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
#lb .lb-box .e{font-size:56px;animation:lbPop .5s ease both}
#lb .lb-box h3{font-size:22px;font-weight:900;margin:6px 0}
#lb .lb-box p{color:var(--mut);font-size:14px}
#lb .lb-code{display:block;width:100%;margin:16px 0 4px;padding:14px;border-radius:16px;border:2px dashed var(--p);
  background:color-mix(in srgb,var(--p) 8%,#fff);font-size:28px;font-weight:900;letter-spacing:.12em;color:var(--p)}
#lb .lb-x{position:absolute;z-index:2;top:10px;right:12px;width:36px;height:36px;border-radius:50%;font-size:20px;color:var(--mut)}
#lb .lb-toast{position:fixed;left:50%;bottom:24px;z-index:10000;transform:translateX(-50%);background:var(--tx);color:#fff;font-weight:800;
  font-size:14px;padding:10px 18px;border-radius:99px;animation:lbIn .2s ease both}
#lb .lb-confetti{position:fixed;inset:0;pointer-events:none;z-index:10001;overflow:hidden}
#lb .lb-confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:lbFall linear forwards}
@keyframes lbFall{to{transform:translateY(110vh) rotate(720deg)}}

@media (prefers-reduced-motion:reduce){#lb *,#lb *::before{animation:none!important;transition:none!important}}
</style>

<div class="lb-shapes" aria-hidden="true"></div>

<main class="lb-wrap">
  <!-- INÍCIO -->
  <section data-view="home">
    <div class="lb-logo"><div class="lb-logo-in" id="lb-logo"></div></div>
    <h1 class="lb-name" id="lb-name"></h1>
    <p class="lb-slogan" id="lb-slogan"></p>
    <nav class="lb-links" id="lb-links"></nav>
    <div id="lb-quizblock">
    <div class="lb-quizcta">
      <h2 id="lb-quiz-title"></h2>
      <p id="lb-quiz-sub"></p>
    </div>
    <div class="lb-links"><button class="lb-link hl" type="button" data-go="quiz">
      <span class="lb-ico">🧡</span><span class="lb-txt"><strong id="lb-quiz-btn"></strong></span><span class="lb-arrow">›</span>
    </button></div>
    </div>
    <p class="lb-foot" id="lb-foot"></p>
  </section>

  <!-- QUIZ -->
  <section data-view="quiz" hidden>
    <div class="lb-top"><button class="lb-back" type="button" id="lb-quiz-back">‹ voltar</button><h2>Seu estilo ideal</h2></div>
    <div id="lb-quiz"></div>
  </section>

  <!-- SALA DE JOGOS -->
  <section data-view="games" hidden>
    <div class="lb-top"><button class="lb-back" type="button" data-go="home">‹ voltar</button><h2>Sala de Jogos 🎠</h2></div>
    <p class="lb-sub" id="lb-games-sub"></p>
    <div class="lb-games" id="lb-games"></div>
    <button class="lb-btn" type="button" id="lb-mycoupon" hidden>🎁 Ver meu cupom</button>
  </section>

  <!-- JOGANDO -->
  <section data-view="play" hidden>
    <div class="lb-top"><button class="lb-back" type="button" data-go="games">‹ jogos</button><h2 id="lb-g-title" style="margin-right:0"></h2><span class="lb-pill" id="lb-g-level"></span></div>
    <p class="lb-status" id="lb-g-status" aria-live="polite"></p>
    <div class="lb-stage" id="lb-stage"></div>
  </section>
</main>

<div class="lb-modal" id="lb-modal" hidden role="dialog" aria-modal="true" aria-labelledby="lb-m-title">
  <div class="lb-box">
    <button class="lb-x" type="button" id="lb-m-close" aria-label="Fechar">✕</button>
    <div class="e">🎉</div>
    <h3 id="lb-m-title">Uhuul, você chegou lá!</h3>
    <p id="lb-m-text"></p>
    <button class="lb-code" type="button" id="lb-m-code" aria-label="Copiar código"></button>
    <p>Toque no código para copiar e mostre para a gente na hora da compra</p>
    <a class="lb-btn wa" id="lb-m-wa" target="_blank" rel="noopener">💬 Resgatar no WhatsApp</a>
  </div>
</div>

<script>
(function () {
  /* ===================================================================
     CONFIGURAÇÃO DA LOJA — edite só aqui
     =================================================================== */
  var CONFIG = {
    loja: 'Balão Mágico',
    slogan: 'Você merece momentos mágicos!',  // texto, ou lista ['A','B','C'] para separar com +
    logo: 'logo.svg',               // URL da imagem do logo (quadrada). Vazio = mostra as iniciais
    whatsapp: '5588921592270',      // DDI + DDD + número, só números. Ex.: 5588999998888
    mensagemPedido: 'Oi! Vim pelo Instagram e quero fazer um pedido 😊',
    rodape: 'Crateús – CE 🎈',

    // Botões da página inicial (na ordem em que aparecem).
    // acao: 'whatsapp' (abre conversa), 'jogos' (sala de jogos) ou um link https://...
    // icone: whatsapp | mapa | google | instagram | link  — ou qualquer emoji
    links: [
      { icone: 'whatsapp',  titulo: 'Fazer pedido',            sub: 'Fala com a gente na hora 💬',                 acao: 'whatsapp' },
      { icone: 'mapa',      titulo: 'Localização',             sub: 'Rua Dr. Moreira da Rocha, 664 — Centro, Crateús', acao: 'https://www.google.com/maps/search/?api=1&query=Rua+Dr.+Moreira+da+Rocha%2C+664%2C+Centro%2C+Crate%C3%BAs+-+CE%2C+63700-088' },
      { icone: 'google',    titulo: 'Avalie a Balão Mágico',   sub: 'Sua avaliação ajuda demais 💛',               acao: 'https://share.google/MRuQopyGHJsrnaDgq' },
      { icone: 'instagram', titulo: 'Siga no Instagram',       sub: '@balaomagicocrateus',                        acao: 'https://www.instagram.com/balaomagicocrateus/' }
      // Para reativar os joguinhos com cupom, adicione:
      // { icone: '🎮', titulo: 'Jogue e ganhe desconto', sub: '4 joguinhos — complete o nível 10 e ganhe 10% OFF', acao: 'jogos', selo: '✨ Jogue', destaque: true }
    ],

    cores: {
      principal:  '#9a6ad0',
      secundaria: '#f3c933',
      destaque:   '#4fc7b5',
      fundo1:     '#effbf8',
      fundo2:     '#f5eefc',
      texto:      '#3b3249'
    },

    cupom: {
      codigo: 'BALAO10',
      desconto: '10% OFF',
      mensagem: 'Oi! Cheguei no nível 10 nos joguinhos e ganhei o cupom {codigo} 🎉'
    },

    // Figurinhas usadas no jogo da memória (mínimo 8)
    emojisJogo: ['🎈', '👗', '👟', '🎀', '🧸', '🧢', '⭐', '🌈', '🦄', '🍭'],

    quiz: {
      mostrar: false,                // true = mostra o "Não sabe o que escolher?" na página inicial
      titulo: 'Não sabe o que escolher? 🤔',
      sub: 'Responda 5 perguntinhas rápidas e a gente te diz o estilo perfeito',
      botao: 'Descobrir o estilo ideal',
      perguntas: [
        { q: 'Pra qual ocasião você está buscando?', o: [
          ['☀️', 'Dia a dia', 'casual'], ['🌷', 'Um passeio especial', 'romantico'],
          ['🎉', 'Festa ou evento', 'moderno'], ['💼', 'Trabalho ou compromisso', 'classico'] ] },
        { q: 'Quais cores mais combinam com você?', o: [
          ['👖', 'Jeans e tons neutros', 'casual'], ['🌸', 'Rosa, lilás e tons pastel', 'romantico'],
          ['⚡', 'Vibrantes e neon', 'moderno'], ['🤍', 'Preto, branco e bege', 'classico'] ] },
        { q: 'Qual estampa você prefere?', o: [
          ['〰️', 'Listras e tie-dye', 'casual'], ['🌼', 'Floral delicado', 'romantico'],
          ['🐆', 'Animal print ou geométrica', 'moderno'], ['▫️', 'Lisa, bem básica', 'classico'] ] },
        { q: 'O que não pode faltar numa roupa?', o: [
          ['☁️', 'Conforto acima de tudo', 'casual'], ['🎀', 'Detalhes fofos: laços e babados', 'romantico'],
          ['🔥', 'Algo que chame atenção', 'moderno'], ['📐', 'Um caimento impecável', 'classico'] ] },
        { q: 'Escolha um calçado:', o: [
          ['👟', 'Tênis', 'casual'], ['🩰', 'Sapatilha', 'romantico'],
          ['🥾', 'Bota ou plataforma', 'moderno'], ['👞', 'Mocassim ou scarpin', 'classico'] ] }
      ],
      resultados: {
        casual:    { e: '😎', t: 'Casual Confortável', d: 'Você ama peças leves e práticas, que acompanham o dia todo sem perder o charme.',
                     msg: 'Oi! Fiz o quiz e meu estilo é Casual Confortável 😎 Quero ver as peças!' },
        romantico: { e: '🌸', t: 'Romântico Delicado', d: 'Tons suaves, laços, babados e florais têm tudo a ver com você.',
                     msg: 'Oi! Fiz o quiz e meu estilo é Romântico Delicado 🌸 Quero ver as peças!' },
        moderno:   { e: '⚡', t: 'Moderno e Ousado',   d: 'Cores vibrantes, recortes diferentes e peças que chamam atenção por onde passa.',
                     msg: 'Oi! Fiz o quiz e meu estilo é Moderno e Ousado ⚡ Quero ver as peças!' },
        classico:  { e: '✨', t: 'Clássico Elegante', d: 'Básicos de qualidade, cortes bem feitos e combinações que nunca saem de moda.',

      var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
      if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
    });
    window.addEventListener('keydown', key);
    var pad = el('div', 'lb-pad4',
      '<span></span><button type="button" data-d="0,-1" aria-label="Cima">▲</button><span></span>' +
      '<button type="button" data-d="-1,0" aria-label="Esquerda">◀</button><button type="button" data-d="0,1" aria-label="Baixo">▼</button><button type="button" data-d="1,0" aria-label="Direita">▶</button>');
    pad.addEventListener('pointerdown', function (e) { var b = e.target.closest('[data-d]'); if (!b) return; e.preventDefault(); var d = b.getAttribute('data-d').split(','); turn(+d[0], +d[1]); });
    stage.appendChild(cv); stage.appendChild(pad);
    api.setLevel(1); upd(); draw();
    timer = setTimeout(step, 400);
    return function () { dead = true; clearTimeout(timer); window.removeEventListener('keydown', key); };
  }

  /* ---------- cupom ---------- */
  var modal = $('lb-modal');
  function openCoupon(celebrate) {
    $('lb-m-text').textContent = 'Você desbloqueou ' + CONFIG.cupom.desconto + ' na sua próxima compra na ' + CONFIG.loja;
    $('lb-m-code').textContent = CONFIG.cupom.codigo;
    $('lb-m-wa').href = wa(CONFIG.cupom.mensagem.replace('{codigo}', CONFIG.cupom.codigo));
    modal.hidden = false; $('lb-m-close').focus({ preventScroll: true });
    if (celebrate) confetti();
  }
  function closeCoupon() { modal.hidden = true; if (current === 'games') renderGames(); }
  $('lb-m-close').addEventListener('click', closeCoupon);
  modal.addEventListener('click', function (e) { if (e.target === modal) closeCoupon(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !modal.hidden) closeCoupon(); });
  $('lb-m-code').addEventListener('click', function () {
    var code = CONFIG.cupom.codigo;
    function ok() { toast('Código copiado! ✅'); }
    function fallback() { var t = document.createElement('textarea'); t.value = code; t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); ok(); } catch (e) { toast('Anote o código: ' + code); } t.remove(); }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(code).then(ok, fallback); else fallback();
  });
  function toast(msg) { var t = el('div', 'lb-toast'); t.textContent = msg; root.appendChild(t); setTimeout(function () { t.remove(); }, 1800); }
  function confetti() {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var box = el('div', 'lb-confetti'), colors = [CONFIG.cores.principal, CONFIG.cores.secundaria, CONFIG.cores.destaque, '#7aa7ff'];
    for (var i = 0; i < 70; i++) {
      var p = el('i'); p.style.left = Math.random() * 100 + '%'; p.style.background = colors[i % 4];
      p.style.animationDuration = (1.8 + Math.random() * 1.6) + 's'; p.style.animationDelay = (Math.random() * .5) + 's';
      box.appendChild(p);
    }
    root.appendChild(box); setTimeout(function () { box.remove(); }, 4200);
  }
})();
</script>
</div>
<!-- FIM DO BLOCO -->
</body>
